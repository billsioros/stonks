services:
  app:
    container_name: stonks-app
    build: .
    ports:
      - "${STONKS_PORT:-8501}:8501"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    command: ["streamlit", "run", "src/stonks/app.py"]
    restart: unless-stopped
    networks:
      - stonks-network
  worker:
    container_name: stonks-worker
    build: .
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "stonks.worker"]
    restart: unless-stopped
    networks:
      - stonks-network
networks:
  stonks-network:
    driver: bridge
