services:
  app:
    container_name: app
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    command: ["streamlit", "run", "src/stonks/app.py"]
    restart: unless-stopped
    networks:
      - stonks-network
  worker:
    container_name: worker
    build: .
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "stonks.worker"]
    restart: unless-stopped
    networks:
      - stonks-network
networks:
  stonks-network:
    driver: bridge
