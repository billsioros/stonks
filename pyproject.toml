[build-system]
build-backend = "uv_build"

requires = [ "uv-build>=0.9,<0.10" ]

[project]
name = "stonks"
version = "2.9.0"
description = "Streamlit Stock Screener powered by StockAnalysis bulk data"
readme = "README.md"
authors = [
  { name = "billsioros", email = "billsioros97@gmail.com" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.27",
  "openrouter>=1.3.63",
  "pandas>=2.3.1",
  "plotly>=7.1",
  "pyarrow>=23.0.1",
  "streamlit>=1.45",
]

[dependency-groups]
dev = [
  "ansible>=11.5",
  "coverage[toml]>=7.6.1",
  "factory-boy>=3.3.3",
  "hypothesis>=6.142.3",
  "ipykernel>=6.29.5",
  "ipywidgets>=8.1.5",
  "jupyter>=1.1.1",
  "mdx-truly-sane-lists>=1.3",
  "mkdocs>=1.6.1",
  "mkdocs-glightbox>=0.5.1",
  "mkdocs-material[imaging]>=9.6.21",
  "mkdocs-minify-plugin>=0.8",
  "mkdocs-redirects>=1.2.1",
  "mkdocstrings[python]>=0.26.1",
  "mypy>=1.11.2",
  "neoteroi-mkdocs>=1.1",
  "paracelsus>=0.7.1",
  "poethepoet>=0.28",
  "prek>=0.3.9",
  "pymdown-extensions>=10.11.1",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24",
  "pytest-clarity>=1.0.1",
  "pytest-cov>=5",
  "pytest-sugar>=1",
  "python-semantic-release>=9",
  "ruff>=0.17.6",
  "scikit-learn>=1.7.1",
]

[tool.pytest.ini_options]
testpaths = [ "tests" ]
asyncio_mode = "auto"

[tool.coverage.run]
source = [ "src/stonks" ]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.poe.tasks]
app = "streamlit run src/stonks/app.py"
test = "pytest tests/ -v"
coverage = "pytest --cov=stonks --cov-report=term-missing"
lint = "mypy src/"
hooks = "prek"

[tool.bandit]
exclude_dirs = [ "tests" ]

[tool.semantic_release]
version_variable = "src/stonks/__init__.py:__version__"
version_toml = [ "pyproject.toml:project.version" ]
major_on_zero = true
branch = "master"
upload_to_PyPI = false
upload_to_release = true
build_command = "pip install build && python -m build"
