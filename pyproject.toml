[project]
name = "stonks"
version = "0.1.0"
description = "Streamlit Stock Screener powered by Finnhub free tier"
readme = "README.md"
authors = [
    { name = "billsioros", email = "billsioros97@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.45.0",
    "finnhub-python>=2.4.20",
    "pandas>=2.3.1",
]

[dependency-groups]
dev = [
    "mypy>=1.11.2",
    "pre-commit>=3.8.0",
    "poethepoet>=0.28.0",
    "coverage[toml]>=7.6.1",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "pytest-sugar>=1.0.0",
    "pytest-clarity>=1.0.1",
    "pytest-asyncio>=0.24.0",
    "mkdocs>=1.6.1",
    "mkdocs-material[imaging]>=9.6.21",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-redirects>=1.2.1",
    "mkdocs-glightbox>=0.5.1",
    "mkdocstrings[python]>=0.26.1",
    "mdx-truly-sane-lists>=1.3",
    "neoteroi-mkdocs>=1.1.0",
    "pymdown-extensions>=10.11.1",
    "paracelsus>=0.7.1",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "jupyter>=1.1.1",
    "ansible>=11.5.0",
    "factory-boy>=3.3.3",
    "scikit-learn>=1.7.1",
    "hypothesis>=6.142.3",
    "python-semantic-release>=9.0.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.poe.tasks]
app = "streamlit run src/stonks/app.py"
test = "pytest tests/ -v"
lint = "mypy src/"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["src/stonks"]

[tool.coverage.report]
show_missing = true
